<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Safe Computer Stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
/* Layout: one big picture card, two giant answer buttons, a row of stars. Single bright classroom look, no reading needed. */
:root{
  --sky:#E6F2F8; --card:#FFFFFF; --ink:#1D3557; --yes:#2E9E5B; --no:#D64545; --gold:#F2B705; --muted:#8AA3B5;
  --font:"Andika","Comic Neue","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--font);margin:0}
.app{min-height:100%;box-sizing:border-box;padding-block:16px;padding-inline:16px;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:900px;margin:0 auto}
.stars{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.stars svg{width:clamp(22px,5vw,38px);height:auto}
.stars .on path{fill:var(--gold);stroke:#B98900}
.stars path{fill:var(--card);stroke:var(--muted);stroke-width:2.5;transition:fill .3s}
.card{background:var(--card);border-radius:28px;box-shadow:0 6px 0 #C7DCE8;width:100%;max-width:760px;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;gap:4%;padding:4%;box-sizing:border-box;position:relative;overflow:hidden}
.card img{max-height:100%;max-width:100%;object-fit:contain;min-width:0}
.scene{display:flex;align-items:flex-end;justify-content:center;gap:4%;height:100%;width:100%}
.scene > *{min-width:0}
.listen{position:absolute;top:12px;right:12px;width:64px;height:64px;border-radius:50%;border:none;background:var(--ink);cursor:pointer;display:grid;place-items:center}
.listen svg{width:34px;height:34px}
.answers{display:flex;gap:clamp(20px,8vw,80px);justify-content:center}
.big{width:clamp(110px,22vw,170px);height:clamp(110px,22vw,170px);border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .12s}
.big:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.big svg{width:58%;height:58%}
.yes{background:var(--yes)} .no{background:var(--no)}
.big:focus-visible,.listen:focus-visible,.play:focus-visible{outline:5px solid var(--gold);outline-offset:4px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.flash-yes{box-shadow:0 0 0 10px var(--yes),0 6px 0 #C7DCE8}
.flash-no{box-shadow:0 0 0 10px var(--no),0 6px 0 #C7DCE8}
.play{width:clamp(150px,30vw,220px);height:clamp(150px,30vw,220px);border-radius:50%;border:none;background:var(--yes);cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 0 #1F6E40}
.play svg{width:50%;height:50%}
.title{font-size:clamp(28px,6vw,52px);font-weight:700;margin:0;text-align:center;text-wrap:balance}
.caption{font-size:clamp(16px,3vw,22px);text-align:center;max-width:60ch;margin:0;min-height:1.4em}
.screen{background:var(--ink);border-radius:18px;padding:3%;width:58%;aspect-ratio:4/3;box-sizing:border-box;display:flex}
.screen > div{background:#fff;border-radius:8px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8%;padding:6%}
.bubble{background:#E3E8EE;border-radius:14px;height:18%;width:80%}
.bubble.mean{background:#F6C9C9}
.speech{position:absolute;top:8%;left:6%;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:10px 18px;font-size:clamp(14px,2.4vw,22px);font-weight:700}
.end-star{width:clamp(160px,35vw,260px)}
.end-star path{fill:var(--gold);stroke:#B98900;stroke-width:2}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.big{transition:none}}
[hidden]{display:none!important}
</style>

const im=(k,h,alt)=>`<img src="${IMG[k]}" alt="${alt||k}" style="max-height:${h||100}%">`;
const house=`<svg viewBox="0 0 100 90" style="width:55%"><path d="M10 45 L50 10 L90 45 V85 H10 Z" fill="#F2B705"/><rect x="40" y="55" width="20" height="30" fill="#1D3557"/><path d="M5 47 L50 7 L95 47" stroke="#D64545" stroke-width="8" fill="none" stroke-linejoin="round"/></svg>`;
const Q=[
 {scene:()=>im("twohands",95,"Carrying a tablet with two hands"),say:"Look. This person carries the tablet with two hands. Is that OK?",ans:true,yes:"Yes! Two hands keep the tablet safe.",no:"Hmm. Two hands keep the tablet safe. That is OK!"},
 {scene:()=>im("password",95,"Typing a password"),say:"This is a password. Is it OK to tell your friends your password?",ans:false,right:"That's right! Your password is private. Keep it secret."},
 {scene:()=>im("child_tablet",95,"A child using a tablet nicely"),say:"This boy uses the tablet nicely and gently. Is that OK?",ans:true,right:"Yes! Gentle hands. Well done!"},
 {scene:()=>`${im("alex",70,"Alex")}${im("phonehand",45,"A phone")}${im("andeep",80,"Andeep")}<div class="speech">Stop!</div>`,say:"Alex says: Stop! Don't take my photo! But Andeep takes the photo. Is that OK?",ans:false,right:"That's right! Always ask before you take a photo."},
 {scene:()=>im("broken",95,"A broken phone"),say:"Oh no! This phone fell and broke. Is it OK to run with a tablet in one hand?",ans:false,right:"That's right! Walk, and use two hands."},
 {scene:()=>im("desktop",90,"A computer"),say:"At the computer, we sit on our chair with our feet on the floor. Is that OK?",ans:true,right:"Yes! Sit nicely. Well done!"},
 {scene:()=>im("games",95,"Video games"),say:"This game is for grown-ups. Is it OK for you to play it?",ans:false,right:"That's right! Play games for your age."},
 {scene:()=>`<div class="screen"><div>${house}</div></div>${im("izzy",80,"Izzy")}`,say:"Izzy tells everyone on the computer where she lives. Is that OK?",ans:false,right:"That's right! Where you live is private."},
 {scene:()=>`<div class="screen"><div><div class="bubble mean"></div><div class="bubble mean"></div><div class="bubble"></div></div></div>${im("jacob",75,"Jacob")}`,say:"Jacob sends unkind messages to his friend. Is that OK?",ans:false,right:"That's right! Be kind on the computer."},
 {scene:()=>`${im("alex2",65,"Alex")}${im("aisha",90,"Aisha")}${im("drawing",55,"A drawing on a tablet")}<div class="speech">Aisha?</div>`,say:"Alex is talking to Aisha. But Aisha keeps playing on the tablet. Is that OK?",ans:false,right:"That's right! Stop and listen when someone talks to you."},
 {scene:()=>`${im("alex2",75,"A sad child")}${im("tablet",75,"A tablet")}`,say:"Something on the tablet makes you feel sad or scared. You tell a grown-up. Is that a good idea?",ans:true,right:"Yes! Always tell a grown-up."},
];
const $=id=>document.getElementById(id);
let i=0,stars=0,locked=false,voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
let sayId=0;
function say(t,done){const id=++sayId;$("caption").textContent=t;let fired=false;
 const fin=()=>{if(fired||id!==sayId)return;fired=true;done&&done();};
 setTimeout(fin,1500+t.length*85);
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.rate=0.88;u.pitch=1.05;u.onend=fin;u.onerror=()=>setTimeout(fin,800);speechSynthesis.speak(u);}catch(e){}}
let ac;function tone(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const notes=ok?[660,880,1100]:[220,180];notes.forEach((f,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ok?"triangle":"sawtooth";o.frequency.value=f;g.gain.setValueAtTime(0.0001,ac.currentTime+k*0.12);g.gain.exponentialRampToValueAtTime(ok?0.25:0.12,ac.currentTime+k*0.12+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+k*0.12+0.25);o.connect(g).connect(ac.destination);o.start(ac.currentTime+k*0.12);o.stop(ac.currentTime+k*0.12+0.3);});}catch(e){}}
const starSVG='<svg viewBox="0 0 100 100"><path d="M50 5 L62 37 L96 38 L69 59 L79 92 L50 73 L21 92 L31 59 L4 38 L38 37 Z"/></svg>';
function drawStars(){$("stars").innerHTML=Q.map((_,k)=>`<span class="${k<stars?'on':''}">${starSVG}</span>`).join("");}
function show(){locked=false;const q=Q[i];$("scene").innerHTML=q.scene();$("card").className="card";say(q.say);}
function answer(v){if(locked)return;const q=Q[i];const card=$("card");
 if(v===q.ans){locked=true;tone(true);stars++;drawStars();card.classList.add(v?"flash-yes":"flash-no");
   say(q.right||q.yes,()=>{i++; if(i<Q.length) setTimeout(show,500); else finish();});}
 else{tone(false);const b=v?$("yesBtn"):$("noBtn");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");say("Oops! Listen again.",()=>setTimeout(()=>say(q.say),300));}
}
function finish(){$("game").hidden=true;$("end").hidden=false;say("Well done! You are a safe computer star!");}
function start(){i=0;stars=0;drawStars();$("start").hidden=true;$("end").hidden=true;$("game").hidden=false;
 say("Hello! Look at the picture and listen. If it is OK, click the green thumb. If it is not OK, click the red thumb.",()=>setTimeout(show,400));}
$("playBtn").onclick=start;$("againBtn").onclick=start;
$("yesBtn").onclick=()=>answer(true);$("noBtn").onclick=()=>answer(false);
$("listen").onclick=()=>say(Q[i].say);
drawStars();
</script>
